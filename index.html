<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090a">
  <meta name="description" content="Enigmática — an independent studio of games and enigmas." data-i18n-attr="content:meta.description">
  <meta property="og:title" content="Enigmática">
  <meta property="og:description" content="Enigmas are art.">
  <meta property="og:image" content="https://enigmatica.art.br/assets/enigmatica-logo.png">
  <link rel="icon" href="assets/enigmatica-mark.png">
  <link rel="preload" href="assets/fonts/cinzel-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=20">
  <title>Enigmática</title>
</head>
<body>
  <canvas class="mist" aria-hidden="true"></canvas>

  <div class="page">
    <header class="top">
      <div class="lang" role="group" aria-label="Language" data-i18n-attr="aria-label:langGroup">
        <button type="button" data-lang="pt" aria-pressed="false" lang="pt-BR" title="Português (Brasil)">PT</button>
        <button type="button" data-lang="en" aria-pressed="true" lang="en" title="English">EN</button>
      </div>
    </header>

    <main class="stage">
      <section class="brand" aria-labelledby="brand-name">
        <div class="cube" data-cube>
          <img src="assets/enigmatica-mark.png" width="202" height="202" alt="Enigmática logo" data-i18n-attr="alt:logoAlt">
        </div>
        <h1 id="brand-name">Enigmática</h1>
        <p class="motto" data-i18n="motto">Enigmas are art.</p>
      </section>

      <nav class="projects-wrap" aria-labelledby="projects-label">
        <h2 id="projects-label" class="label" data-i18n="projects">Projects</h2>
        <ul id="projects" class="projects"></ul>
      </nav>

      <nav class="channels-wrap" aria-labelledby="channels-label">
        <h2 id="channels-label" class="label" data-i18n="channels">Official channels</h2>
        <ul id="channels" class="channels"></ul>
      </nav>
      <noscript><p class="noscript">Ative o JavaScript para ver os links. · Enable JavaScript to see the links.</p></noscript>
    </main>

    <footer class="foot">© <span id="year">2026</span> Enigmática · Arthur Nascimento Nogueira</footer>
  </div>

  <script src="i18n.js?v=12"></script>
  <script src="links.js?v=20"></script>
</body>
</html>
