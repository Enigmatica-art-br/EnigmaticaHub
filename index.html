<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080a">
  <meta name="description" content="Enigmática — projetos, jogos e canais oficiais.">
  <meta property="og:title" content="Enigmática">
  <meta property="og:description" content="Enigmas são arte. Projetos, jogos e canais oficiais.">
  <meta property="og:image" content="https://enigmatica.art.br/assets/enigmatica-logo.png">
  <link rel="icon" href="assets/enigmatica-logo.png">
  <link rel="preload" href="assets/fonts/syne-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=10">
  <title>Enigmática</title>
</head>
<body>
  <canvas class="light" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <div class="shell">
    <header class="top">
      <div class="lang" role="group" aria-label="Idioma" data-i18n-attr="aria-label:langGroup">
        <button type="button" data-lang="pt" aria-pressed="true" lang="pt-BR" title="Português (Brasil)">PT</button>
        <button type="button" data-lang="en" aria-pressed="false" lang="en" title="English">EN</button>
      </div>
    </header>

    <section class="brand" aria-labelledby="brand-name">
      <div class="cube" data-cube>
        <img src="assets/enigmatica-logo.png" width="256" height="256" alt="Logo da Enigmática" data-i18n-attr="alt:logoAlt">
      </div>
      <div class="brand-copy">
        <h1 id="brand-name">Enigmática</h1>
        <p class="motto" data-i18n="motto">Enigmas são arte.</p>
      </div>
    </section>

    <main class="links">
      <nav aria-labelledby="links-label">
        <h2 id="links-label" class="links-label" data-i18n="linksHeading">Projetos e canais oficiais</h2>
        <ul id="link-list"></ul>
      </nav>
      <noscript><p class="noscript">Ative o JavaScript para ver os links. · Enable JavaScript to see the links.</p></noscript>
    </main>

    <footer class="foot">
      <span>© <span id="year">2026</span> Enigmática</span>
      <span>Arthur Nascimento Nogueira</span>
    </footer>
  </div>

  <script src="i18n.js?v=10"></script>
  <script src="links.js?v=10"></script>
</body>
</html>
